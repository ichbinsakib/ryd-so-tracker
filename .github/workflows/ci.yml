name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Field-mapping doc is up to date
        run: |
          npm run gen:docs
          git diff --exit-code docs/field-mapping.md
