name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # The API URL (Supabase Edge Function) is a public value set here. No secret is needed or used.
      - name: Write production config
        env:
          API_URL: https://clumhidxgzfkwzwrtngi.supabase.co/functions/v1/api
        run: |
          node -e "require('fs').writeFileSync('frontend/config.js','window.APP_CONFIG='+JSON.stringify({API_URL:process.env.API_URL,DEV_MODE:false})+';')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
